# Deploy with:  kubectl apply -k k8s/
# Pin releases here (or `kustomize edit set image oniva=registry/oniva:1.4.2`); never use :latest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oniva
resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - postgres-init-configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - migrate-job.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  # redis-sentinel.yaml is an optional HA alternative to the single Redis in deployment.yaml.
images:
  - name: oniva
    newName: oniva            # e.g. registry.example.com/oniva
    newTag: REPLACE_WITH_RELEASE_TAG
  - name: oniva-frontend
    newName: oniva-frontend   # e.g. registry.example.com/oniva-frontend
    newTag: REPLACE_WITH_RELEASE_TAG
  - name: oniva-engine
    newName: oniva-engine     # e.g. registry.example.com/oniva-engine
    newTag: REPLACE_WITH_RELEASE_TAG
