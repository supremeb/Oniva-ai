apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: oniva
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: oniva
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
# Shared by all API replicas (sessions, volumes, artifacts). Needs a ReadWriteMany-capable
# storage class (NFS, EFS, Filestore, CephFS). Change storageClassName for your cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oniva-data-pvc
  namespace: oniva
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard-rwx
