apiVersion: v1
kind: Service
metadata:
  name: oniva-api
  namespace: oniva
spec:
  selector:
    app: oniva-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: oniva-frontend
  namespace: oniva
spec:
  selector:
    app: oniva-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oniva
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: oniva
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
# Cluster-internal only (ClusterIP, no ingress route).
apiVersion: v1
kind: Service
metadata:
  name: oniva-engine
  namespace: oniva
spec:
  selector:
    app: oniva-engine
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
