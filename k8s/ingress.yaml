apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oniva-ingress
  namespace: oniva
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - oniva.example.com
    secretName: oniva-tls
  rules:
  - host: oniva.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: oniva-api
            port:
              number: 8000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: oniva-api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oniva-frontend
            port:
              number: 3000
