apiVersion: apps/v1
kind: Deployment
metadata:
  name: oniva-api
  namespace: oniva
  labels:
    app: oniva-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oniva-api
  template:
    metadata:
      labels:
        app: oniva-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      # Block until the oniva-migrate Job has brought the schema to head.
      - name: wait-for-migrations
        image: oniva
        command:
        - sh
        - -c
        - |
          until alembic current 2>/dev/null | grep -q "(head)"; do
            echo "waiting for migrations (oniva-migrate Job)..."; sleep 5
          done
        envFrom:
        - configMapRef:
            name: oniva-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: DB_PASSWORD
        - name: MIGRATION_DATABASE_URL
          value: "postgresql+asyncpg://oniva:$(DB_PASSWORD)@postgres:5432/oniva"
        - name: DATABASE_URL
          value: "postgresql+asyncpg://oniva:$(DB_PASSWORD)@postgres:5432/oniva"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: api
        image: oniva
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: oniva-config
        # NOTE: $(VAR) expansion only sees variables from earlier `env` entries, NOT envFrom.
        # Secrets are therefore listed explicitly first, then the URLs that reference them.
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: SECRET_KEY
        - name: ENCRYPTION_SALT
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ENCRYPTION_SALT
        - name: APP_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: APP_DATABASE_PASSWORD
        - name: SYSTEM_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: SYSTEM_DATABASE_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: REDIS_PASSWORD
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: DB_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+asyncpg://oniva_app:$(APP_DATABASE_PASSWORD)@postgres:5432/oniva"
        - name: SYSTEM_DATABASE_URL
          value: "postgresql+asyncpg://oniva_system:$(SYSTEM_DATABASE_PASSWORD)@postgres:5432/oniva"
        - name: MIGRATION_DATABASE_URL
          value: "postgresql+asyncpg://oniva:$(DB_PASSWORD)@postgres:5432/oniva"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: OPENROUTER_API_KEY
              optional: true
        # Engine seams: ENGINE_GATEWAY_TOKEN guards /internal (engine -> backend);
        # ENGINE_SERVICE_TOKEN is presented to the engine (backend -> engine).
        - name: ENGINE_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ENGINE_GATEWAY_TOKEN
        - name: ENGINE_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ENGINE_SERVICE_TOKEN
        - name: ENGINE_GATEWAY_TOKEN_PREVIOUS
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ENGINE_GATEWAY_TOKEN_PREVIOUS
              optional: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: oniva-data-pvc
      - name: tmp
        emptyDir: {}
      imagePullSecrets:
      - name: regcred
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oniva-frontend
  namespace: oniva
  labels:
    app: oniva-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oniva-frontend
  template:
    metadata:
      labels:
        app: oniva-frontend
    spec:
      containers:
      - name: frontend
        image: oniva-frontend
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://oniva-api:8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
      imagePullSecrets:
      - name: regcred
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oniva
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # single RWO volume
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
        env:
        # POSTGRES_USER is the schema OWNER; the app connects as oniva_app / oniva_system.
        - name: POSTGRES_USER
          value: "oniva"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: DB_PASSWORD
        - name: APP_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: APP_DATABASE_PASSWORD
        - name: SYSTEM_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: SYSTEM_DATABASE_PASSWORD
        - name: POSTGRES_DB
          value: "oniva"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - oniva
            - -d
            - oniva
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - oniva
            - -d
            - oniva
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init
          defaultMode: 0555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: oniva
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: REDIS_PASSWORD
        # redis-cli reads REDISCLI_AUTH, so the probes authenticate without putting the password in argv
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: REDIS_PASSWORD
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
        - --appendonly
        - "yes"
        - --maxmemory
        - 512mb
        - --maxmemory-policy
        - allkeys-lru
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
# One engine worker serves one session (ENGINE_SESSION_ID): keep replicas at 1 and
# Recreate so a rollout never runs two owners of the lease at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oniva-engine
  namespace: oniva
  labels:
    app: oniva-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oniva-engine
  template:
    metadata:
      labels:
        app: oniva-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: engine
        image: oniva-engine
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: production
        - name: ENGINE_PORT
          value: "8080"
        - name: ENGINE_SESSION_ID
          valueFrom:
            configMapKeyRef:
              name: oniva-config
              key: ENGINE_SESSION_ID
        - name: ENGINE_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ENGINE_SERVICE_TOKEN
        - name: ENGINE_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ENGINE_GATEWAY_TOKEN
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: oniva-secrets
              key: ENGINE_DATABASE_URL
        # Cluster-internal only: the Service oniva-api is never routed by the ingress for /internal.
        - name: ENGINE_GATEWAY_URL
          value: "http://oniva-api:8000"
        - name: ENGINE_POLICY
          value: backend
        - name: ENGINE_POLICY_URL
          value: "http://oniva-api:8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
