# NOTE: In production, use external secrets management (Vault, AWS Secrets Manager, External Secrets).
# This file is a template - replace every REPLACE_WITH_* value before applying.
# Use URL-safe values (hex or token_urlsafe) for the passwords: they are embedded in connection URLs.
# Generate with: python backend/scripts/generate_secrets.py
apiVersion: v1
kind: Secret
metadata:
  name: oniva-secrets
  namespace: oniva
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_SECURE_KEY_MIN_32_CHARS"
  # 64 hex chars: python -c "import secrets; print(secrets.token_hex(32))"
  ENCRYPTION_SALT: "REPLACE_WITH_64_HEX_CHARS"
  # Schema owner (POSTGRES_USER=oniva). Used only by the migration Job / migration init container.
  DB_PASSWORD: "REPLACE_WITH_OWNER_PASSWORD"
  # oniva_app: NOSUPERUSER NOBYPASSRLS, the request path (DATABASE_URL)
  APP_DATABASE_PASSWORD: "REPLACE_WITH_APP_ROLE_PASSWORD"
  # oniva_system: BYPASSRLS, scheduler/webhooks/startup recovery (SYSTEM_DATABASE_URL)
  SYSTEM_DATABASE_PASSWORD: "REPLACE_WITH_SYSTEM_ROLE_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  # Engine seams. Three distinct values, each >= 32 chars and different from SECRET_KEY:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  # ENGINE_GATEWAY_TOKEN guards /internal (engine -> backend). Rotate by moving the old value to
  # ENGINE_GATEWAY_TOKEN_PREVIOUS (optional key, add it to this Secret), rolling both sides, then removing it.
  ENGINE_GATEWAY_TOKEN: "REPLACE_WITH_ENGINE_GATEWAY_TOKEN_MIN_32_CHARS"
  # ENGINE_SERVICE_TOKEN is what the backend presents to the engine (backend -> engine).
  ENGINE_SERVICE_TOKEN: "REPLACE_WITH_ENGINE_SERVICE_TOKEN_MIN_32_CHARS"
  # The engine's own Postgres database (not the Oniva one): postgres://user:pass@host:5432/oniva_engine
  ENGINE_DATABASE_URL: "REPLACE_WITH_ENGINE_POSTGRES_URL"
  # Optional: LLM API keys (user provides)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENROUTER_API_KEY: ""
