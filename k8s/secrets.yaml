# NOTE: In production, use external secrets management (Vault, AWS Secrets Manager)
# This file is a template - replace placeholder values before applying
apiVersion: v1
kind: Secret
metadata:
  name: oniva-secrets
  namespace: oniva
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  SECRET_KEY: "REPLACE_WITH_SECURE_KEY_MIN_32_CHARS"
  DB_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"
  # Optional: LLM API keys (user provides)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENROUTER_API_KEY: ""
