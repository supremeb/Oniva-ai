# Data Retrieval Agent Test Cases
# Part of Phase 1: Production Reliability
#
# These test cases evaluate the DataRetrievalAgent's ability to:
# - Fetch stock prices and market data
# - Retrieve company financial information
# - Access economic indicators
# - Handle API errors gracefully
#
# Total: 50 test cases

---
# ============================================
# Stock Price Retrieval (15 test cases)
# ============================================

- id: "data-retrieval-001"
  description: "Get current stock price - AAPL"
  input: "Get the current stock price for Apple Inc (AAPL)"
  expected:
    symbol: "AAPL"
    has_price: true
    price:
      check: "numeric_range"
      min: 50
      max: 500
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "stock_price"

- id: "data-retrieval-002"
  description: "Get current stock price - MSFT"
  input: "What is Microsoft's current stock price?"
  expected:
    symbol: "MSFT"
    has_price: true
    price:
      check: "numeric_range"
      min: 100
      max: 600
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "stock_price"

- id: "data-retrieval-003"
