  agent_type: "data_retrieval"
  category: "company_financials"

- id: "data-retrieval-027"
  description: "Get company balance sheet"
  input: "Get Microsoft's balance sheet"
  expected:
    company: "Microsoft"
    has_total_assets: true
    has_total_liabilities: true
    has_shareholders_equity: true
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "company_financials"

- id: "data-retrieval-028"
  description: "Get company cash flow statement"
  input: "Get Amazon's cash flow statement"
