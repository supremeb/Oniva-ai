# ============================================
# Error Handling & Edge Cases (5 test cases)
# ============================================

- id: "data-retrieval-046"
  description: "Handle API timeout gracefully"
  input: "Get stock data with simulated timeout"
  expected:
    error: true
    graceful_handling: true
    error_type_contains: ["timeout", "unavailable", "retry"]
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "error_handling"

- id: "data-retrieval-047"
  description: "Handle rate limiting"
  input: "Get data for 100 stocks simultaneously"
  expected:
    graceful_handling: true
    response_contains: ["rate limit", "batch", "queued"]
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "error_handling"

- id: "data-retrieval-048"
  description: "Handle malformed input"
  input: "Get stock price for $$$INVALID!!!"
  expected:
    error: true
    error_type_contains: ["invalid", "malformed", "parse"]
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "error_handling"

- id: "data-retrieval-049"
  description: "Handle weekend/holiday request"
  input: "Get AAPL price for Christmas Day 2023"
  expected:
    response_contains: ["holiday", "closed", "no trading"]
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "error_handling"

- id: "data-retrieval-050"
  description: "Handle empty response"
  input: "Get stock data for newly listed company with no history"
  expected:
    has_data: false
    response_contains: ["no data", "limited", "new listing"]
  evaluation_method: "deterministic"
  agent_type: "data_retrieval"
  category: "error_handling"
