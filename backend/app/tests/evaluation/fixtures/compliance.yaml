# Compliance Agent Test Cases
# Part of Phase 1: Production Reliability
#
# These test cases evaluate the ComplianceAgent's ability to:
# - Screen entities against OFAC SDN lists
# - Evaluate transaction risk
# - Perform KYC/AML checks
# - Generate compliance recommendations
#
# Total: 50 test cases

---
# ============================================
# OFAC SDN Screening (15 test cases)
# ============================================

- id: "compliance-001"
  description: "Clean entity - no OFAC match"
  input: "Screen John Smith at 123 Main St, Springfield IL for OFAC SDN"
  expected:
    result: "PASS"
    risk_level: "LOW"
    rationale_contains: ["No match found", "OFAC SDN"]
  evaluation_method: "deterministic"
  agent_type: "compliance"
  category: "ofac_screening"

- id: "compliance-002"
  description: "Transaction to sanctioned country - Iran"
  input: "Screen transaction of $15,000 to recipient in Tehran, Iran"
  expected:
    result: "FAIL"
    risk_level: "CRITICAL"
    rationale_contains: ["sanctioned", "Iran"]
  evaluation_method: "deterministic"
  agent_type: "compliance"
  category: "ofac_screening"

