# ============================================
# Compliance Recommendations (10 test cases)
# ============================================

- id: "compliance-041"
  description: "File SAR recommendation"
  input: "Recommend action for confirmed structuring pattern"
  expected:
    recommendation: "FILE_SAR"
    rationale_contains: ["SAR", "suspicious activity report"]
  evaluation_method: "deterministic"
  agent_type: "compliance"
  category: "recommendations"

- id: "compliance-042"
  description: "Enhanced monitoring recommendation"
  input: "Recommend action for PEP with unusual transaction pattern"
  expected:
