# Research Agent Test Cases
# Part of Phase 1: Production Reliability
#
# These test cases evaluate the ResearchAgent's ability to:
# - Perform RAG-based document search
# - Answer financial research questions
# - Synthesize information from multiple sources
# - Generate research summaries
#
# Total: 50 test cases

---
# ============================================
# Document Retrieval (12 test cases)
# ============================================

- id: "research-001"
  description: "Find relevant SEC filings"
  input: "Find Apple's latest 10-K filing"
  expected:
    document_type: "10-K"
    company: "Apple"
    has_filing_date: true
    has_content_summary: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-002"
  description: "Find quarterly earnings report"
  input: "Find Microsoft's Q4 2023 earnings report"
  expected:
    document_type_contains: ["10-Q", "8-K", "earnings"]
    company: "Microsoft"
    quarter: "Q4"
    year: 2023
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-003"
  description: "Find proxy statement"
  input: "Find Tesla's latest DEF 14A proxy statement"
  expected:
    document_type: "DEF 14A"
    company: "Tesla"
    has_filing_date: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-004"
  description: "Find IPO prospectus"
  input: "Find Rivian's S-1 prospectus from their IPO"
  expected:
    document_type: "S-1"
    company: "Rivian"
    context_contains: ["IPO", "prospectus", "offering"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-005"
  description: "Find merger announcement"
  input: "Find the 8-K filing for Microsoft's Activision acquisition"
  expected:
    document_type: "8-K"
    companies_mentioned_contains: ["Microsoft", "Activision"]
    context_contains: ["acquisition", "merger"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-006"
  description: "Find analyst report"
  input: "Find recent analyst reports on NVIDIA"
  expected:
    company: "NVIDIA"
    has_analyst_ratings: true
    has_price_targets: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-007"
  description: "Find industry report"
  input: "Find industry reports on the semiconductor sector"
  expected:
    sector: "semiconductor"
    has_industry_analysis: true
    has_market_trends: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-008"
  description: "Find earnings call transcript"
  input: "Find Amazon's latest earnings call transcript"
  expected:
    company: "Amazon"
    document_type: "earnings call"
    has_transcript: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-009"
  description: "Find company press release"
  input: "Find Google's press releases about AI announcements"
  expected:
    company_contains: ["Google", "Alphabet"]
    document_type: "press release"
    topic_contains: ["AI", "artificial intelligence"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-010"
  description: "Find regulatory filing with specific content"
  input: "Find SEC filings where companies mention climate risk"
  expected:
    has_results: true
    content_contains: ["climate", "risk", "environmental"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-011"
  description: "Handle non-existent document"
  input: "Find XYZ123 Corp's 10-K filing"
  expected:
    error: true
    error_type_contains: ["not found", "no results", "unknown company"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

- id: "research-012"
  description: "Find multiple related documents"
  input: "Find all SEC filings from Meta in 2023"
  expected:
    company: "Meta"
    year: 2023
    result_count:
      check: "numeric_range"
      min: 4
      max: 50
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "document_retrieval"

# ============================================
# Question Answering (14 test cases)
# ============================================

- id: "research-013"
  description: "Answer factual question from 10-K"
  input: "What was Apple's total revenue in fiscal year 2023?"
  expected:
    has_answer: true
    source_type: "10-K"
    answer_contains: ["revenue", "billion"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-014"
  description: "Answer question about risk factors"
  input: "What are the main risk factors mentioned in Tesla's 10-K?"
  expected:
    has_answer: true
    risk_factors:
      check: "length_range"
      min: 3
      max: 20
    source_type: "10-K"
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-015"
  description: "Answer question about executive compensation"
  input: "What was the CEO compensation at Microsoft last year?"
  expected:
    has_answer: true
    source_type_contains: ["DEF 14A", "proxy"]
    answer_contains: ["compensation", "salary", "stock"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-016"
  description: "Answer question about business segments"
  input: "What are Amazon's main business segments and their revenue breakdown?"
  expected:
    has_answer: true
    segments:
      check: "length_range"
      min: 3
      max: 10
    has_revenue_breakdown: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-017"
  description: "Answer question about guidance"
  input: "What guidance did NVIDIA provide for next quarter?"
  expected:
    has_answer: true
    guidance_type_contains: ["revenue", "EPS", "margin"]
    has_outlook: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-018"
  description: "Answer question about competitive position"
  input: "How does Apple describe its competitive advantages?"
  expected:
    has_answer: true
    competitive_factors_contains: ["ecosystem", "brand", "innovation"]
    source_cited: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-019"
  description: "Answer question about litigation"
  input: "What major legal proceedings is Google facing?"
  expected:
    has_answer: true
    legal_matters:
      check: "length_range"
      min: 1
      max: 20
    source_type_contains: ["10-K", "10-Q", "8-K"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-020"
  description: "Answer question about R&D spending"
  input: "How much does Microsoft spend on R&D annually?"
  expected:
    has_answer: true
    has_dollar_amount: true
    context_contains: ["research", "development", "R&D"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-021"
  description: "Answer question about debt structure"
  input: "What is Amazon's long-term debt and when does it mature?"
  expected:
    has_answer: true
    has_debt_amount: true
    has_maturity_schedule: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-022"
  description: "Answer question about insider ownership"
  input: "What percentage of Tesla shares do insiders own?"
  expected:
    has_answer: true
    ownership_percentage:
      check: "numeric_range"
      min: 0
      max: 100
    source_type_contains: ["DEF 14A", "proxy"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-023"
  description: "Answer complex question requiring reasoning"
  input: "How has Apple's gross margin trended over the past 3 years and why?"
  expected:
    has_trend_analysis: true
    has_explanation: true
    reasoning_quality:
      check: "llm_judge"
      category: "reasoning"
      threshold: 0.7
  evaluation_method: "llm_judge"
  agent_type: "research"
  category: "question_answering"

- id: "research-024"
  description: "Answer question with conflicting sources"
  input: "What is the consensus view on Netflix's subscriber growth?"
  expected:
    has_answer: true
    acknowledges_different_views: true
    has_synthesis: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-025"
  description: "Handle unanswerable question"
  input: "What is Apple's secret unreleased product roadmap?"
  expected:
    answer_contains: ["not available", "confidential", "not disclosed", "cannot answer"]
    acknowledges_limitation: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

- id: "research-026"
  description: "Answer question about ESG"
  input: "What are Microsoft's environmental sustainability initiatives?"
  expected:
    has_answer: true
    esg_topics_contains: ["carbon", "renewable", "sustainability"]
    has_specific_initiatives: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "question_answering"

# ============================================
# Research Synthesis (12 test cases)
# ============================================

- id: "research-027"
