# ============================================
# Research Quality & Edge Cases (12 test cases)
# ============================================

- id: "research-039"
  description: "Cite sources properly"
  input: "What is Apple's cash position? Cite your sources."
  expected:
    has_answer: true
    has_citations: true
    citations_include_contains: ["10-K", "10-Q", "filing date"]
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-040"
  description: "Acknowledge data recency"
  input: "What is Tesla's current production capacity?"
  expected:
    has_answer: true
    acknowledges_data_date: true
    has_recency_caveat: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-041"
  description: "Handle outdated information request"
  input: "What was Enron's stock price in 2000?"
  expected:
    has_answer: true
    has_historical_context: true
    acknowledges_company_status: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-042"
  description: "Distinguish fact from opinion"
  input: "Is Tesla overvalued?"
  expected:
    distinguishes_fact_opinion: true
    presents_multiple_perspectives: true
    does_not_make_definitive_claim: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-043"
  description: "Handle speculative question appropriately"
  input: "Will Amazon stock go up tomorrow?"
  expected:
    does_not_predict: true
    response_contains: ["cannot predict", "uncertain", "depends on"]
    may_provide_context: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-044"
  description: "Research small-cap company"
  input: "Research Palantir Technologies business model"
  expected:
    company: "Palantir"
    has_business_description: true
    acknowledges_limited_coverage: false
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-045"
  description: "Research foreign company"
  input: "Research Samsung Electronics financials"
  expected:
    company: "Samsung"
    acknowledges_reporting_differences: true
    currency_mentioned: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-046"
  description: "Research private company"
  input: "Research SpaceX's business and financials"
  expected:
    company: "SpaceX"
    acknowledges_private_status: true
    uses_available_public_info: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-047"
  description: "Research recent event"
  input: "Research the impact of the latest Fed rate decision"
  expected:
    has_event_summary: true
    has_market_reaction: true
    acknowledges_recency: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-048"
  description: "Handle ambiguous company name"
  input: "Research Apple's competitors"
  expected:
    clarifies_company: true
    company: "Apple Inc"
    does_not_confuse_with_other_apple: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-049"
  description: "Research with conflicting data"
  input: "What is the market share of iPhone globally?"
  expected:
    has_answer: true
    acknowledges_data_variance: true
    provides_range_or_multiple_sources: true
  evaluation_method: "deterministic"
  agent_type: "research"
  category: "research_quality"

- id: "research-050"
  description: "Comprehensive research with quality check"
  input: "Provide a thorough due diligence report on Stripe"
  expected:
    has_company_overview: true
    has_financials_if_available: true
    has_competitive_analysis: true
    has_risk_factors: true
    has_growth_drivers: true
    research_quality:
      check: "llm_judge"
      category: "completeness"
      threshold: 0.8
  evaluation_method: "llm_judge"
  agent_type: "research"
  category: "research_quality"
