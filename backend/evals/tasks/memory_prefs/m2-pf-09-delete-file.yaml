# [medium] Guards memory retention: the preference is applied, then the user deletes the file and no trace of it is left in the next conversation.
id: m2-pf-09-delete-file
kind: memory
tags:
- memory
input:
  statement: 'Remember for this project: indent code samples with tabs, not spaces.'
  token: tabs, not spaces
  question: Show a two-line example of the retry loop.
  expect: \t
  stored_path: core.md
  canaries:
    project: ZQ-FOREIGN-PROJECT-4471
    tenant: ZQ-FOREIGN-TENANT-8820
  delete: file
  question_again: Show a two-line example of the retry loop. (asked again)
  delete_tokens:
  - tabs, not spaces
environment:
  web: 'off'
  tenant_settings:
    memory: manual
fake:
  rules:
  - when:
      role: user
      includes: 'Remember for this project: indent code samples with tabs, not spaces.'
    respond:
      steps:
      - type: tool_call
        name: memory_create
        arguments:
          path: core.md
          file_text: '- Indent code samples with tabs, not spaces.'
      usage:
        inputTokens: 300
        outputTokens: 50
  - when:
      role: tool_result
      tool: memory_create
    respond:
      steps:
      - type: text
        text: Saved to project memory.
      usage:
        inputTokens: 350
        outputTokens: 10
  - when:
      role: user
      includes: Show a two-line example of the retry loop. (asked again)
    respond:
      steps:
      - type: text
        text: Here is a plain two-line example of the retry loop.
      usage:
        inputTokens: 300
        outputTokens: 20
  - when:
      role: user
      includes: Show a two-line example of the retry loop.
    respond:
      steps:
      - type: text
        text: "```\nfor attempt in range(3):\n\ttry_request()\n```"
      usage:
        inputTokens: 400
        outputTokens: 30
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: pref-applied
  type: preference_applied
  params:
    token: tabs, not spaces
    expect: \t
- id: injected-clean
  type: no_instruction_in_injected_block
  params:
    require_blocks: true
- id: no-cross-project-leak
  type: cross_project_leak
- id: memory-applied
  type: judge
  gating: false
  params:
    judge: memory_applied
- id: deleted-gone
  type: deleted_means_gone
  params:
    min_probes: 1
budget:
  max_usd: 0.25
  max_rounds: 6
