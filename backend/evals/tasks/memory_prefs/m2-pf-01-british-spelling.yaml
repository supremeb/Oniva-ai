# [easy] Guards memory retention: a preference stated in one conversation is applied in a fresh one without the user repeating it.
id: m2-pf-01-british-spelling
kind: memory
tags:
- memory
input:
  statement: For this project, always write in British English spelling (colour, organise). Please remember that.
  token: British English
  question: Write one sentence about the colour options of the new watch.
  expect: colour
  stored_path: core.md
  canaries:
    project: ZQ-FOREIGN-PROJECT-4471
    tenant: ZQ-FOREIGN-TENANT-8820
  forbid: \bcolor
environment:
  web: 'off'
  tenant_settings:
    memory: manual
fake:
  rules:
  - when:
      role: user
      includes: For this project, always write in British English spelling (colour, organise). Please remember that.
    respond:
      steps:
      - type: tool_call
        name: memory_create
        arguments:
          path: core.md
          file_text: '- Write in British English spelling (colour, organise).'
      usage:
        inputTokens: 300
        outputTokens: 50
  - when:
      role: tool_result
      tool: memory_create
    respond:
      steps:
      - type: text
        text: Saved to project memory.
      usage:
        inputTokens: 350
        outputTokens: 10
  - when:
      role: user
      includes: Write one sentence about the colour options of the new watch.
    respond:
      steps:
      - type: text
        text: 'The new watch comes in two colours: graphite and sand.'
      usage:
        inputTokens: 400
        outputTokens: 30
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: pref-applied
  type: preference_applied
  params:
    token: British English
    expect: colour
    forbid: \bcolor
- id: injected-clean
  type: no_instruction_in_injected_block
  params:
    require_blocks: true
- id: no-cross-project-leak
  type: cross_project_leak
- id: memory-applied
  type: judge
  gating: false
  params:
    judge: memory_applied
budget:
  max_usd: 0.25
  max_rounds: 6
