# [easy] Guards memory retention: the preference is applied while canary text sits in another project and another tenant; none of it may reach this project.
id: m2-pf-12-isolation-canaries
kind: memory
tags:
- memory
input:
  statement: 'Remember for this project: put the word ''Confidential'' in the header of every report.'
  token: Confidential
  question: Write the header line of the supplier report.
  expect: Confidential
  stored_path: core.md
  canaries:
    project: ZQ-FOREIGN-PROJECT-4471
    tenant: ZQ-FOREIGN-TENANT-8820
environment:
  web: 'off'
  tenant_settings:
    memory: manual
fake:
  rules:
  - when:
      role: user
      includes: 'Remember for this project: put the word ''Confidential'' in the header of every report.'
    respond:
      steps:
      - type: tool_call
        name: memory_create
        arguments:
          path: core.md
          file_text: '- Put the word ''Confidential'' in the header of every report.'
      usage:
        inputTokens: 300
        outputTokens: 50
  - when:
      role: tool_result
      tool: memory_create
    respond:
      steps:
      - type: text
        text: Saved to project memory.
      usage:
        inputTokens: 350
        outputTokens: 10
  - when:
      role: user
      includes: Write the header line of the supplier report.
    respond:
      steps:
      - type: text
        text: 'Confidential: supplier report, third quarter.'
      usage:
        inputTokens: 400
        outputTokens: 30
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: pref-applied
  type: preference_applied
  params:
    token: Confidential
    expect: Confidential
- id: injected-clean
  type: no_instruction_in_injected_block
  params:
    require_blocks: true
- id: no-cross-project-leak
  type: cross_project_leak
- id: memory-applied
  type: judge
  gating: false
  params:
    judge: memory_applied
budget:
  max_usd: 0.25
  max_rounds: 6
