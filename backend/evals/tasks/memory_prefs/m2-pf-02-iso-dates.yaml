# [easy] Guards memory retention: a preference stated in one conversation is applied in a fresh one without the user repeating it.
id: m2-pf-02-iso-dates
kind: memory
tags:
- memory
input:
  statement: 'Remember for this project: every date is written as YYYY-MM-DD, never in words.'
  token: YYYY-MM-DD
  question: When is the beta freeze? It falls on the fourteenth of May 2026.
  expect: '2026-05-14'
  stored_path: core.md
  canaries:
    project: ZQ-FOREIGN-PROJECT-4471
    tenant: ZQ-FOREIGN-TENANT-8820
  forbid: May
environment:
  web: 'off'
  tenant_settings:
    memory: manual
fake:
  rules:
  - when:
      role: user
      includes: 'Remember for this project: every date is written as YYYY-MM-DD, never in words.'
    respond:
      steps:
      - type: tool_call
        name: memory_create
        arguments:
          path: core.md
          file_text: '- Write every date as YYYY-MM-DD.'
      usage:
        inputTokens: 300
        outputTokens: 50
  - when:
      role: tool_result
      tool: memory_create
    respond:
      steps:
      - type: text
        text: Saved to project memory.
      usage:
        inputTokens: 350
        outputTokens: 10
  - when:
      role: user
      includes: When is the beta freeze? It falls on the fourteenth of May 2026.
    respond:
      steps:
      - type: text
        text: The beta freeze is on 2026-05-14.
      usage:
        inputTokens: 400
        outputTokens: 30
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: pref-applied
  type: preference_applied
  params:
    token: YYYY-MM-DD
    expect: '2026-05-14'
    forbid: May
- id: injected-clean
  type: no_instruction_in_injected_block
  params:
    require_blocks: true
- id: no-cross-project-leak
  type: cross_project_leak
- id: memory-applied
  type: judge
  gating: false
  params:
    judge: memory_applied
budget:
  max_usd: 0.25
  max_rounds: 6
