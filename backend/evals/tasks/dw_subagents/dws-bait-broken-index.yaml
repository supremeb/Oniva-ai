# [hard] Guards citation hygiene: the first draft cites a source number that does not exist ([9]). Without the verifier the citation check refuses dw_finalize and the orchestrator repairs it afterwards; with the verifier step the draft is repaired before the first finalize.
id: dws-bait-broken-index
kind: deep_work
tags:
- dw_subagents
input:
  query: Compare the battery warranties of the Kestrel and Lumen scooters
  plan:
    title: DWPLAN_BI_DWS_BAIT_BROKEN_INDEX
    sub_queries:
    - worker_id: bi-w1
      sub_query: kestrel scooter battery warranty
      tools:
      - web_search
    - worker_id: bi-w2
      sub_query: lumen scooter battery warranty
      tools:
      - web_search
    deliverable: null
environment:
  web: replay
fake:
  findings_md: Kestrel covers the battery for two years [1][2] and Lumen for three [3][4].
  scenario:
    bait: broken_index
    findings_fixed: Kestrel covers the battery for two years [1][2] and Lumen for three [3][4].
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: no-compaction-failure
  type: no_compaction_failure
- id: tool-order
  type: tool_order
- id: workers-ok
  type: worker_failure_rate
  gating: true
  params:
    max_rate: 0.0
- id: malformed
  type: malformed_worker_answers
  params:
    max: 0
- id: citations-clean
  type: broken_citations
  params:
    max_blocked: 0
- id: citations-map
  type: citation_map
- id: learnings-sourced
  type: learning_sources
- id: urls-resolve
  type: url_resolves
- id: tools-ok
  type: tool_error_rate
  params:
    max_rate: 0.2
- id: budget
  type: budget
  params:
    max_usd: 1.5
    max_rounds: 12
- id: claims-supported
  type: judge
  params:
    judge: claim_supported
- id: no-unsourced-facts
  type: judge
  params:
    judge: no_unsourced_facts
budget:
  max_usd: 1.5
  max_rounds: 12
