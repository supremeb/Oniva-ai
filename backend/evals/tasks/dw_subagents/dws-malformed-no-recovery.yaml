# [hard] Guards a worker that stays malformed after the reminder. With contract v2 the orchestrator gets an error result (never a malformed answer as if it were good); the worker counts as failed, which this task accepts.
id: dws-malformed-no-recovery
kind: deep_work
tags:
- dw_subagents
input:
  query: Compare the cancellation rules of the Fjord and Gale gyms
  plan:
    title: DWPLAN_M3_DWS_MALFORMED_NO_RECOVERY
    sub_queries:
    - worker_id: m3-w1
      sub_query: fjord gym membership cancellation rules
      tools:
      - web_search
    - worker_id: m3-w2
      sub_query: gale gym membership cancellation rules
      tools:
      - web_search
    deliverable: null
environment:
  web: replay
fake:
  findings_md: Fjord needs thirty days notice [1][2] and Gale allows cancellation online at any time [3][4].
  scenario:
    prose:
      m3-w2: prose
    nudge: ignore
