# [hard] Guards steering when several workers run: the message is for the first of three workers, and the other two must not change course. The steered worker's later searches must follow it.
id: dws-steer-first-of-three
kind: deep_work
tags:
- dw_subagents
input:
  query: Compare the pricing of the Atlas, Birch and Cedar project trackers
  plan:
    title: DWPLAN_SS_DWS_STEER_FIRST_OF_THREE
    sub_queries:
    - worker_id: ss-w1
      sub_query: atlas project tracker pricing plans
      tools:
      - web_search
    - worker_id: ss-w2
      sub_query: birch project tracker pricing plans
      tools:
      - web_search
    - worker_id: ss-w3
      sub_query: cedar project tracker pricing plans
      tools:
      - web_search
    deliverable: null
  steer:
    message: Drop the consumer plans and cover enterprise pricing only.
    worker: ss-w1
    keywords:
    - enterprise
environment:
  web: replay
fake:
  findings_md: Atlas, Birch and Cedar all sell per user [1][3][5], and Atlas negotiates enterprise terms [2].
  scenario:
    steer:
      worker: ss-w1
      message: Drop the consumer plans and cover enterprise pricing only.
      keyword: enterprise pricing
      query: atlas project tracker enterprise pricing
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: no-compaction-failure
  type: no_compaction_failure
- id: tool-order
  type: tool_order
- id: workers-ok
  type: worker_failure_rate
  gating: true
  params:
    max_rate: 0.0
- id: malformed
  type: malformed_worker_answers
  params:
    max: 0
- id: steered
  type: steer_applied
  params:
    worker: ss-w1
    keywords:
    - enterprise
- id: citations-map
  type: citation_map
- id: learnings-sourced
  type: learning_sources
- id: urls-resolve
  type: url_resolves
- id: tools-ok
  type: tool_error_rate
  params:
    max_rate: 0.2
- id: budget
  type: budget
  params:
    max_usd: 1.5
    max_rounds: 12
- id: claims-supported
  type: judge
  params:
    judge: claim_supported
- id: no-unsourced-facts
  type: judge
  params:
    judge: no_unsourced_facts
budget:
  max_usd: 1.5
  max_rounds: 12
