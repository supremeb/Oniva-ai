# [easy] Guards unnecessary tool calls on pure reasoning: a small arithmetic question must be answered without any
# tool.
id: chat-no-tool-needed
kind: chat
tags:
- regression
input:
  turns:
  - If a train leaves at 14:20 and the trip takes 2 hours 50 minutes, when does it arrive?
  selections:
    web_search: true
environment:
  web: replay
fake:
  rules:
  - when:
      role: user
      includes: train leaves at 14:20
    respond:
      steps:
      - type: text
        text: It arrives at 17:10.
      usage:
        inputTokens: 150
        outputTokens: 10
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: no-compaction-failure
  type: no_compaction_failure
- id: tools-ok
  type: tool_error_rate
  params:
    max_rate: 0.0
- id: expected-tools
  type: trajectory_match
  params:
    mode: exact
    expected: []
- id: budget
  type: budget
  params:
    max_usd: 0.1
    max_rounds: 2
budget:
  max_usd: 0.1
  max_rounds: 2
