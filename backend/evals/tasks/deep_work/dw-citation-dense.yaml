# [medium] Guards citation integrity: a report with many numeric claims must only use [N] markers that map to
# saved sources (the uncited and out-of-range citation failure class).
id: dw-citation-dense
kind: deep_work
tags:
- regression
input:
  query: 'Gather key facts on three fictional transit systems: Marrow Line, Tern Express and Yarrow Loop'
  plan:
    title: DWPLAN_CD_DW_CITATION_DENSE
    sub_queries:
    - worker_id: cd-w1
      sub_query: marrow line transit ridership and fares
      tools:
      - web_search
    - worker_id: cd-w2
      sub_query: tern express transit ridership and fares
      tools:
      - web_search
    - worker_id: cd-w3
      sub_query: yarrow loop transit ridership and fares
      tools:
      - web_search
    deliverable: null
environment:
  web: replay
fake:
  findings_md: Marrow Line carries about 80 thousand weekday riders [1] at 2.40 euros a trip [2]. Tern Express carries
    120 thousand [3] at 3.10 euros [4]. Yarrow Loop carries 35 thousand [5] at 1.90 euros [6].
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: no-compaction-failure
  type: no_compaction_failure
- id: tool-order
  type: tool_order
- id: workers-ok
  type: no_failed_workers
- id: citations-map
  type: citation_map
- id: learnings-sourced
  type: learning_sources
- id: urls-resolve
  type: url_resolves
- id: tools-ok
  type: tool_error_rate
  params:
    max_rate: 0.0
- id: budget
  type: budget
  params:
    max_usd: 1.5
    max_rounds: 8
- id: claims-supported
  type: judge
  params:
    judge: claim_supported
- id: no-unsourced-facts
  type: judge
  params:
    judge: no_unsourced_facts
budget:
  max_usd: 1.5
  max_rounds: 8
