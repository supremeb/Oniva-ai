# [hard] Guards the memory lift: four worker gap round is run 5 times in a row in one project; with memory on (the curator proposes, a reviewer approves) the last run should score above the first, and the no-memory control arm should not.
id: m3-rp-05-four-worker-gap-round
kind: repeat
tags:
- memory
- repeat
input:
  runs: 5
  query: 'Survey community solar programme rules in four fictional regions: Aldermark, Brennick, Corvale and Dunmoor'
  plan:
    title: DWPLAN_FG_DW_FOUR_WORKER_GAP_ROUND
    sub_queries:
    - worker_id: fg-w1
      sub_query: aldermark community solar programme rules
      tools:
      - web_search
    - worker_id: fg-w2
      sub_query: brennick community solar programme rules
      tools:
      - web_search
    - worker_id: fg-w3
      sub_query: corvale community solar programme rules
      tools:
      - web_search
    - worker_id: fg-w4
      sub_query: dunmoor community solar programme rules
      tools:
      - web_search
    deliverable: null
  reviewer: approve_unflagged
  score_graders:
  - id: no-failed-workers
    type: no_failed_workers
  - id: citations-map
    type: citation_map
  - id: learnings-sourced
    type: learning_sources
  - id: urls-resolve
    type: url_resolves
  - id: tools-ok
    type: tool_error_rate
    params:
      max_rate: 0.0
  - id: rounds
    type: rounds
    params:
      max: 9
  canaries:
    project: ZQ-FOREIGN-PROJECT-4471
    tenant: ZQ-FOREIGN-TENANT-8820
environment:
  web: replay
fake:
  findings_md: Aldermark caps projects at two megawatts [1] and Brennick at five [3]; Dunmoor sets no cap [7]. Corvale pays
    eleven cents per kilowatt hour [5] and limits one subscriber to forty percent [6]. Brennick needs ten subscribers [4]
    and Dunmoor pays quarterly [8].
  curator:
    deltas:
    - op: add
      section: Research
      text: Avoid overlapping sub-queries across workers.
    - op: add
      section: Research
      text: Stop after the first round when scores are high.
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: no-compaction-failure
  type: no_compaction_failure
- id: workers-ok
  type: no_failed_workers
- id: citations-map
  type: citation_map
- id: learnings-sourced
  type: learning_sources
- id: urls-resolve
  type: url_resolves
- id: lift
  type: score_lift
  gating: false
  params:
    min_lift: 0.05
- id: curated
  type: memory_curated
- id: no-tainted-active
  type: no_active_write_from_tainted_run
- id: injected-clean
  type: no_instruction_in_injected_block
  params:
    require_blocks: true
- id: no-cross-project-leak
  type: cross_project_leak
- id: overhead
  type: memory_overhead
  params:
    max_block_share: 0.05
    max_curator_share: 0.1
- id: budget
  type: budget
  params:
    max_usd: 4.0
    max_rounds: 12
budget:
  max_usd: 4.0
  max_rounds: 12
