# [hard] Guards the memory lift: budget tight is run 5 times in a row in one project; with memory on (the curator proposes, a reviewer approves) the last run should score above the first, and the no-memory control arm should not.
id: m3-rp-06-budget-tight
kind: repeat
tags:
- memory
- repeat
input:
  runs: 5
  query: Give a short overview of the main water-saving rules for gardens in the fictional district of Eastmere
  plan:
    title: DWPLAN_BT_DW_BUDGET_TIGHT
    sub_queries:
    - worker_id: bt-w1
      sub_query: eastmere district garden watering restrictions
      tools:
      - web_search
    - worker_id: bt-w2
      sub_query: eastmere district rainwater tank rebate
      tools:
      - web_search
    deliverable: null
  reviewer: approve_unflagged
  score_graders:
  - id: no-failed-workers
    type: no_failed_workers
  - id: citations-map
    type: citation_map
  - id: learnings-sourced
    type: learning_sources
  - id: urls-resolve
    type: url_resolves
  - id: tools-ok
    type: tool_error_rate
    params:
      max_rate: 0.0
  - id: rounds
    type: rounds
    params:
      max: 4
  canaries:
    project: ZQ-FOREIGN-PROJECT-4471
    tenant: ZQ-FOREIGN-TENANT-8820
environment:
  web: replay
fake:
  findings_md: Sprinklers are banned from ten to four on summer days while hand watering is always allowed [1][2]. A 150
    euro rebate applies to rainwater tanks fitted by a licensed installer [3][4].
  curator:
    deltas:
    - op: add
      section: Research
      text: Keep the plan to two workers.
    - op: add
      section: Research
      text: Do not open a gap round for minor gaps.
graders:
- id: no-run-error
  type: no_run_error
- id: no-limit-exceeded
  type: no_limit_exceeded
- id: no-compaction-failure
  type: no_compaction_failure
- id: workers-ok
  type: no_failed_workers
- id: citations-map
  type: citation_map
- id: learnings-sourced
  type: learning_sources
- id: urls-resolve
  type: url_resolves
- id: lift
  type: score_lift
  gating: false
  params:
    min_lift: 0.05
- id: curated
  type: memory_curated
- id: no-tainted-active
  type: no_active_write_from_tainted_run
- id: injected-clean
  type: no_instruction_in_injected_block
  params:
    require_blocks: true
- id: no-cross-project-leak
  type: cross_project_leak
- id: overhead
  type: memory_overhead
  params:
    max_block_share: 0.05
    max_curator_share: 0.1
- id: budget
  type: budget
  params:
    max_usd: 4.0
    max_rounds: 12
budget:
  max_usd: 4.0
  max_rounds: 12
