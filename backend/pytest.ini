[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    postgres: needs a real Postgres (local initdb cluster or TEST_DATABASE_URL); run with -m postgres
    e2e: engine smoke against real processes (backend, engine worker, Postgres); needs ONIVA_E2E=1
    load: load gate driver (needs the e2e stack, ONIVA_E2E=1); excluded from CI, run with -m load
    slow: marks tests as slow (deselect with '-m "not slow"')
filterwarnings =
    ignore::DeprecationWarning
