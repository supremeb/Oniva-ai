[project]
name = "oniva-backend"
version = "0.1.0"
description = "Oniva backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    # FastAPI
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "gunicorn>=22.0.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.0.0",
    # Pydantic AI
    "pydantic-ai>=1.77.0,<1.78",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "pgvector==0.3.6",
    # Redis
    "redis[hiredis]==5.2.1",
    # LLM providers
    "openai>=2.30.0",
    "anthropic>=0.89.0",
    # MCP
    "mcp>=1.27.0",
    # Auth & security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=4.0.0,<5.0.0", # passlib 1.7.4 needs bcrypt 4.x
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    # HTTP
    "httpx>=0.28.1",
    "aiohttp>=3.11.10",
    # Logging / observability
    "python-json-logger==2.0.7",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "langsmith>=0.1.0",
    "braintrust[otel]>=0.4.0",
    # Misc
    "aiofiles>=24.0.0",
    "simpleeval==1.0.0",
    "e2b-code-interpreter>=1.0.0",
    "cachetools>=5.3.0",
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "beautifulsoup4==4.12.3",
    "matplotlib>=3.9.2",
    "griffe>=1.3.2",
    # Documents
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.10",
    "chonkie[semantic]==1.5.5",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    # Scheduling
    "apscheduler>=3.11.0",
    "croniter>=2.0.0",
    # SAML
    "python3-saml==1.16.0",
    "docker>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-timeout==2.3.1",
    "faker==33.1.0",
    "freezegun==1.4.0",
    "aiosqlite==0.20.0",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["examples", "migrations/versions"]

[tool.ruff.lint]
# Baseline: errors only (syntax/runtime/undefined names).
select = ["E9", "F63", "F7", "F82"]
