# Production Docker Compose for Oniva
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# SECURITY REQUIREMENTS:
# - All environment variables must be set (see .env.example)
# - DEBUG must be false
# - ENVIRONMENT must be production
# - CORS_ORIGINS must be set to explicit domains
# - Redis password required
# - Three DB roles: POSTGRES_USER (schema owner, runs migrations), oniva_app (request path,
#   RLS enforced), oniva_system (BYPASSRLS). See DEPLOYMENT.md.
# - The app and frontend publish NO host ports (so replicas can scale); traffic enters via nginx.

version: '3.8'

x-app-env: &app-env
  DEBUG: "false"
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://oniva_app:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-oniva}
  SYSTEM_DATABASE_URL: postgresql+asyncpg://oniva_system:${SYSTEM_DATABASE_PASSWORD:?SYSTEM_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-oniva}
  MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-oniva}
  APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  # Read-only rootfs: all writable state lives on the /data volume (see volume-init)
  SESSION_BASE_PATH: /data/sessions
  VOLUMES_BASE_PATH: /data/volumes
  ARTIFACTS_BASE_PATH: /data/artifacts

services:
  # One-shot: make the data volume writable by the non-root app user (uid 1000).
  volume-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/sessions /data/volumes /data/artifacts && chown -R 1000:1000 /data"]
    user: "0:0"
    volumes:
      - appdata:/data
    restart: "no"

  # One-shot: `alembic upgrade head` as the schema owner. The app runs with AUTO_MIGRATE=false.
  migrate:
    image: oniva:${VERSION:?VERSION is required (pin an image tag)}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=50m
    restart: "no"

  app:
    image: oniva:${VERSION:?VERSION is required (pin an image tag)}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      <<: *app-env
      AUTO_MIGRATE: "false"
      # LLM Configuration (user provides)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    volumes:
      - appdata:/data
    # SECURITY: Container hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    tmpfs:
      - /tmp:mode=1777,size=100m
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    image: oniva-frontend:${VERSION:?VERSION is required (pin an image tag)}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      - NEXT_PUBLIC_API_URL=http://app:8000
    expose:
      - "3000"
    depends_on:
      - app
    # SECURITY: Container hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=50m
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-oniva}
      - APP_DATABASE_PASSWORD=${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
      - SYSTEM_DATABASE_PASSWORD=${SYSTEM_DATABASE_PASSWORD:?SYSTEM_DATABASE_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Alphabetical: 01-roles.sh (creates oniva_app/oniva_system with passwords) then init.sql
      - ./postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # SECURITY: Container hardening
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oniva}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    # SECURITY: Require password authentication
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # SECURITY: Container hardening
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy for TLS termination: the only published entrypoint (app/frontend scale behind it)
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - frontend
    # SECURITY: Container hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777

volumes:
  appdata:
  pgdata:
  redisdata:

networks:
  default:
    driver: bridge
